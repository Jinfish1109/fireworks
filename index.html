<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#04050c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>烟花</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#04050c;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  body { position:fixed; left:0; top:0; right:0; bottom:0; }
  canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #bg    { z-index:1; }
  #stars { z-index:2; }
  #fx    { z-index:4; }
  /* 暗角，让画面更有层次 */
  #vig {
    position:absolute; left:0; top:0; width:100%; height:100%; z-index:3;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.28) 72%, rgba(0,0,0,.62) 100%);
  }
  /* 祝福语 */
  #txt {
    position:absolute; left:0; right:0; top:22%; z-index:5;
    text-align:center; pointer-events:none;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    opacity:0; animation:rise 2.4s cubic-bezier(.22,.7,.3,1) .5s forwards;
  }
  #txt h1 {
    font-size:clamp(28px, 9vw, 54px); font-weight:700; color:#fff8e7;
    letter-spacing:.14em; text-indent:.14em;
    text-shadow:0 0 10px rgba(255,214,140,.9), 0 0 28px rgba(255,160,80,.65), 0 0 60px rgba(255,120,60,.4);
  }
  #txt p {
    margin-top:.9em; font-size:clamp(13px, 3.8vw, 18px); color:rgba(255,255,255,.72);
    letter-spacing:.22em; text-indent:.22em; font-weight:300;
    text-shadow:0 0 12px rgba(120,160,255,.55);
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  /* 底部提示 */
  #hint {
    position:absolute; left:0; right:0; bottom:calc(6% + env(safe-area-inset-bottom));
    text-align:center; z-index:5; pointer-events:none;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size:13px; letter-spacing:.18em; color:rgba(255,255,255,.5);
    text-shadow:0 0 10px rgba(0,0,0,.8);
    opacity:0; animation:hintIn 1.6s ease 1.2s forwards, hintOut 1.8s ease 7s forwards;
  }
  @keyframes hintIn  { to { opacity:1; } }
  @keyframes hintOut { to { opacity:0; } }
  /* 声音开关 */
  #snd {
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
    z-index:6; width:42px; height:42px; border-radius:50%; border:0;
    background:rgba(255,255,255,.07); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .2s;
  }
  #snd:active { background:rgba(255,255,255,.18); }
  #snd svg { width:20px; height:20px; fill:none; stroke:rgba(255,255,255,.82); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  #snd .on  { display:block; }
  #snd .off { display:none; }
  #snd.muted .on  { display:none; }
  #snd.muted .off { display:block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="stars"></canvas>
<div id="vig"></div>
<canvas id="fx"></canvas>
<div id="txt"><h1></h1><p></p></div>
<div id="hint">轻触屏幕，放一朵烟花</div>
<button id="snd" class="muted" aria-label="声音开关">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 0 1 0 7"/><path d="M19.8 6a9 9 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5"/><path d="M21 9.5l-4 5"/></svg>
</button>

<script>
(function () {
'use strict';

/* ==========================================================
   想改的地方基本都在这里
   ========================================================== */
var CFG = {
  title:    '',      // 祝福语，例如 '新年快乐'；留空则不显示
  subtitle: '',      // 副标题 / 落款，留空则不显示
  auto:     true,    // 自动连续放烟花
  sound:    true,    // 允许声音（首次触摸之后才会响，微信/iOS 的硬性要求）
  density:  1        // 整体规模：手机卡就调到 0.7，想要更炸就 1.3
};
/* ========================================================== */

var bg = document.getElementById('bg'),
    starC = document.getElementById('stars'),
    fx = document.getElementById('fx'),
    bctx = bg.getContext('2d'),
    sctx = starC.getContext('2d'),
    ctx = fx.getContext('2d');

var W = 0, H = 0, S = 1, DPR = 1;   // S = 屏幕缩放系数，坐标全部按 CSS 像素走

/* ---------- 固定种子的伪随机：保证改窗口大小时天际线不跳 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = Math.random;
function rr(a, b) { return a + rnd() * (b - a); }

/* ============================ 尺寸 ============================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  S = Math.max(0.62, Math.min(H / 780, 1.45));

  var cs = [bg, starC, fx];
  for (var i = 0; i < cs.length; i++) {
    var c = cs[i];
    c.width  = Math.max(1, Math.floor(W * DPR));
    c.height = Math.max(1, Math.floor(H * DPR));
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
    var cx = c.getContext('2d');
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.lineCap = 'round';
    cx.lineJoin = 'round';
  }
  ctx.globalCompositeOperation = 'lighter';
  makeStars();
  drawSky();
}

/* ============================ 天空 ============================ */
function drawSky() {
  bctx.globalCompositeOperation = 'source-over';
  bctx.clearRect(0, 0, W, H);

  // 夜空渐变
  var g = bctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#04050d');
  g.addColorStop(0.42, '#070a17');
  g.addColorStop(0.70, '#0a1020');
  g.addColorStop(1.00, '#111528');
  bctx.fillStyle = g;
  bctx.fillRect(0, 0, W, H);

  // 地平线上方的城市光雾
  var hg = bctx.createRadialGradient(W * 0.5, H * 1.04, 0, W * 0.5, H * 1.04, H * 0.62);
  hg.addColorStop(0.00, 'rgba(255,150,70,.17)');
  hg.addColorStop(0.45, 'rgba(120,95,205,.09)');
  hg.addColorStop(1.00, 'rgba(0,0,0,0)');
  bctx.fillStyle = hg;
  bctx.fillRect(0, 0, W, H);

  drawSkyline();
}

/* ---------- 程序化天际线（固定种子，尺寸变化时不跳） ---------- */
function drawSkyline() {
  var r = mulberry32(20261012);
  var baseY = H;
  var sky = Math.max(H * 0.14, 78 * S);      // 楼最高不超过这个高度
  var y = -20, list = [], ground = [0, 0, 0];

  while (y < W + 20) {
    var w = 22 + r() * 56;
    var h = sky * (0.28 + r() * 0.62);
    if (r() < 0.13) h = sky * (0.85 + r() * 0.35);   // 偶尔来一栋高楼
    list.push({ x: y, w: w, h: h, r: r(), a: r() });
    y += w + (r() < 0.55 ? 0 : r() * 7);
  }

  // 楼体
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    bctx.fillStyle = '#030409';
    bctx.fillRect(b.x, baseY - b.h, b.w, b.h);
    // 楼顶天线
    if (b.a > 0.82) {
      var ax = b.x + b.w * (0.3 + b.r * 0.4);
      bctx.fillRect(ax, baseY - b.h - 11 * S, 1.2, 11 * S);
    }
  }

  // 零星亮着的窗
  bctx.globalCompositeOperation = 'lighter';
  for (var j = 0; j < list.length; j++) {
    var q = list[j];
    var cols = Math.max(1, Math.floor(q.w / 9));
    var rows = Math.max(1, Math.floor(q.h / 11));
    for (var cx2 = 0; cx2 < cols; cx2++) {
      for (var cy2 = 0; cy2 < rows; cy2++) {
        if (r() > 0.055) continue;
        bctx.fillStyle = r() < 0.72 ? 'rgba(255,205,130,.5)' : 'rgba(150,200,255,.42)';
        bctx.fillRect(q.x + 4 + cx2 * 9, baseY - q.h + 5 + cy2 * 11, 2.6, 3.4);
      }
    }
  }
  bctx.globalCompositeOperation = 'source-over';
}

/* ============================ 星星 ============================ */
var stars = [];
function makeStars() {
  stars.length = 0;
  var n = Math.round(Math.min(W * H / 5200, 190));
  for (var i = 0; i < n; i++) {
    var warm = rnd();
    stars.push({
      x: rnd() * W,
      y: rnd() * H * 0.80,
      r: rr(0.35, 1.15) * (H / 780 > 1 ? 1 : 1),
      a: rr(0.18, 0.85),
      ph: rnd() * 6.283,
      sp: rr(0.006, 0.022),
      c: warm < 0.72 ? '255,255,255' : (warm < 0.88 ? '190,215,255' : '255,225,190')
    });
  }
}
function drawStars(t) {
  sctx.clearRect(0, 0, W, H);
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var a = s.a * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
    if (a <= 0.02) continue;
    sctx.globalAlpha = a;
    sctx.fillStyle = 'rgb(' + s.c + ')';
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, 6.2832);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
}

/* ============================ 粒子 ============================ */
var pool = [], P = [], flashes = [], shells = [];
var MAXP = 1400;

function obtain() {
  if (pool.length) return pool.pop();
  return { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, g: 0, drag: 1, life: 0, max: 1,
           size: 1, color: '#fff', hue: 0, tw: 0, tws: 0, sub: 0, dot: false };
}
function release(p) { if (pool.length < 3000) pool.push(p); }

function addP(x, y, vx, vy, o) {
  if (P.length >= MAXP) return null;
  var p = obtain();
  p.x = p.px = x; p.y = p.py = y;
  p.vx = vx; p.vy = vy;
  p.g    = o.g    != null ? o.g    : GRAV;
  p.drag = o.drag != null ? o.drag : 0.985;
  p.max  = o.life;
  p.life = o.life * rr(0.82, 1.12);
  p.size = o.size;
  p.color = o.color;
  p.hue   = o.hue;
  p.tw    = rnd() * 6.283;
  p.tws   = o.tws || 0;
  p.sub   = o.sub || 0;
  p.dot   = !!o.dot;
  P.push(p);
  return p;
}

/* 颜色：以 base 色相为中心 ±20°，避免"纯随机 = 廉价感" */
function hsl(h, l, a) {
  return 'hsla(' + (((h % 360) + 360) % 360).toFixed(0) + ',100%,' + l.toFixed(0) + '%,' + a + ')';
}
var PALETTE = [0, 12, 30, 45, 52, 190, 205, 220, 275, 300, 328, 345];

var GRAV = 0.028;   // 会在 resize 里按屏幕高度重算

/* ============================ 爆炸 ============================ */
var FLASH_T = 0;
function flash(x, y, rad, hue) {
  flashes.push({ x: x, y: y, r: rad, life: 1, hue: hue });
}

function burst(x, y, opt) {
  opt = opt || {};
  var kind  = opt.kind || pickKind();
  var baseH = opt.hue != null ? opt.hue : PALETTE[(rnd() * PALETTE.length) | 0];
  var rainbow = opt.rainbow != null ? opt.rainbow : (rnd() < 0.10);
  var speed = (opt.speed || H * 0.0046) * rr(0.94, 1.08);
  var i, a, sp, hue, l, sz, n;

  var cfg = TYPES[kind];

  flash(x, y, cfg.flash * S, baseH);

  n = Math.round(cfg.n * CFG.density * (opt.scale || 1));
  for (i = 0; i < n; i++) {
    var t  = i / n;
    var d  = cfg.dir(t);
    hue = rainbow ? (baseH + t * 150) : (baseH + rr(-20, 20));
    l   = cfg.l + rr(-6, 6);
    sp  = speed * d[2] * rr(0.93, 1.07);
    sz  = cfg.size * S * rr(0.78, 1.22);
    addP(x, y, d[0] * sp, d[1] * sp, {
      g: cfg.g * S, drag: cfg.drag, life: cfg.life,
      size: sz, color: hsl(hue, l, 1), hue: hue,
      tws: cfg.tws, sub: cfg.sub, dot: cfg.dot
    });
  }

  // 双色芯：内层再点一圈对比色
  if (kind === 'duo' && !opt.inner) {
    var inner = Math.round(n * 0.55);
    for (i = 0; i < inner; i++) {
      var ia = rnd() * 6.2832, ik = (0.34 + 0.18 * rnd()) * rr(0.94, 1.06);
      var ih = baseH + 150 + rr(-14, 14);
      addP(x, y, Math.cos(ia) * speed * ik, Math.sin(ia) * speed * ik, {
        g: cfg.g * S, drag: cfg.drag, life: cfg.life * 0.85,
        size: cfg.size * S * 1.05, color: hsl(ih, 68, 1), hue: ih, tws: 0, sub: 0, dot: false
      });
    }
  }

  // 白热核心粒子：花心那一团亮芯
  var core = Math.round(20 * CFG.density);
  for (i = 0; i < core; i++) {
    a = rnd() * 6.2832; sp = speed * rr(0.03, 0.5);
    addP(x, y, Math.cos(a) * sp, Math.sin(a) * sp, {
      g: GRAV * 1.2 * S, drag: 0.9, life: cfg.life * rr(0.35, 0.62),
      size: cfg.size * S * rr(0.8, 1.3), color: 'rgba(255,246,225,1)', hue: baseH, tws: 0
    });
  }

  boom(cfg.vol, y, kind);
}

/* 各花型的参数与方向函数 */
var TYPES = {
  // 球形菊
  sphere: {
    n: 104, life: 86, g: 0.030, drag: 0.984, size: 1.5, l: 62, flash: 62, vol: 1, tws: 0, sub: 0,
    // 从花心一路填到边缘（sqrt 偏外分布），避免中间出现空心
    dir: function () { var a = rnd() * 6.2832, k = 0.20 + 0.80 * Math.pow(rnd(), 0.62); return [Math.cos(a) * k, Math.sin(a) * k, 1]; }
  },
  // 垂柳：寿命长 + 重力大，拖出长长的下垂尾
  willow: {
    n: 62, life: 170, g: 0.055, drag: 0.988, size: 1.35, l: 70, flash: 46, vol: 0.85, tws: 0.0016, sub: 0,
    dir: function () { var a = rnd() * 6.2832, k = 0.30 + 0.70 * rnd(); return [Math.cos(a) * k, Math.sin(a) * k, 0.86]; }
  },
  // 环形（带倾角，像斜挂在夜空里的圈）
  ring: {
    n: 70, life: 92, g: 0.026, drag: 0.986, size: 1.5, l: 66, flash: 54, vol: 0.9, tws: 0, sub: 0,
    dir: (function () { return null; })()
  },
  // 棕榈：少而粗，尾巴重
  palm: {
    n: 38, life: 140, g: 0.060, drag: 0.99, size: 2.3, l: 64, flash: 52, vol: 1, tws: 0, sub: 0,
    dir: function () { var a = rnd() * 6.2832, k = 0.45 + 0.55 * rnd(); return [Math.cos(a) * k, Math.sin(a) * k, 1.05]; }
  },
  // 闪光菊：闪烁 + 子母弹，噼里啪啦
  crackle: {
    n: 92, life: 62, g: 0.034, drag: 0.978, size: 1.25, l: 76, flash: 58, vol: 1, tws: 0.05, sub: 0.10,
    dir: function () { var a = rnd() * 6.2832, k = 0.25 + 0.75 * Math.pow(rnd(), 0.6); return [Math.cos(a) * k, Math.sin(a) * k, 1.1]; }
  },
  // 双色芯（外环 + 内环异色）
  duo: {
    n: 64, life: 88, g: 0.030, drag: 0.984, size: 1.5, l: 62, flash: 60, vol: 0.95, tws: 0, sub: 0,
    dir: function () { var a = rnd() * 6.2832, k = 0.92 + 0.08 * rnd(); return [Math.cos(a) * k, Math.sin(a) * k, 1]; }
  },
  // 心形（低概率出现）
  heart: {
    n: 92, life: 96, g: 0.028, drag: 0.985, size: 1.6, l: 66, flash: 56, vol: 0.9, tws: 0, sub: 0,
    dir: function () { var t = rnd() * 6.2832, sx = 16 * Math.pow(Math.sin(t), 3),
        sy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return [sx / 15, -sy / 15, 1]; }
  }
};
// 环形单独实现（压扁成椭圆再整体旋转，做出"斜挂着的圈"）
var RING_TILT = 0.62;
TYPES.ring.dir = function () {
  var a = rnd() * 6.2832, k = 0.90 + 0.10 * rnd();
  var ca = Math.cos(RING_TILT), sa = Math.sin(RING_TILT);
  var vx = Math.cos(a) * k, vy = Math.sin(a) * k * 0.40;
  return [vx * ca - vy * sa, vx * sa + vy * ca, 1];
};

var KIND_WEIGHT = ['sphere', 'sphere', 'sphere', 'willow', 'willow', 'crackle',
                   'crackle', 'palm', 'ring', 'duo', 'heart'];
function pickKind() { return KIND_WEIGHT[(rnd() * KIND_WEIGHT.length) | 0]; }

/* ============================ 发射 ============================ */
function launch(tx, ty) {
  if (P.length > MAXP * 0.75) return;
  var x0 = tx != null ? tx : rr(W * 0.12, W * 0.88);
  var y0 = H + 8;
  var tyy = ty != null ? ty : rr(H * 0.10, H * 0.40);
  tyy = Math.max(H * 0.05, Math.min(tyy, H * 0.62));

  var dy = Math.max(60, y0 - tyy);
  var rise = 40 + dy * 0.045;            // 升空帧数（约 0.9~1.2 秒）
  var g = 2 * dy / (rise * rise);
  var vy = -g * rise;
  var vx = (W * 0.5 - x0) * 0.0016 + rr(-0.16, 0.16);

  shells.push({
    x: x0, y: y0, vx: vx, vy: vy, g: g, hue: PALETTE[(rnd() * PALETTE.length) | 0],
    kind: pickKind(), scale: rr(0.85, 1.2), tt: 0
  });
}

function stepShells() {
  for (var i = shells.length - 1; i >= 0; i--) {
    var s = shells[i];
    s.vy += s.g;
    s.x  += s.vx;
    s.y  += s.vy;
    s.tt++;

    // 尾焰
    addP(s.x + rr(-1, 1), s.y + rr(-1, 1), rr(-0.3, 0.3), rr(0.1, 0.8), {
      g: 0.01 * S, drag: 0.90, life: rr(9, 20), size: rr(1, 1.9) * S,
      color: hsl(s.hue + rr(-14, 14), 78, 1), hue: s.hue, tws: 0.03
    });

    if (s.vy >= 0) {                    // 到最高点正好炸开
      burst(s.x, s.y, { kind: s.kind, hue: s.hue, scale: s.scale, speed: H * 0.0046 });
      shells.splice(i, 1);
    }
  }
}

/* ============================ 更新 ============================ */
var autoT = 0;
function update() {
  stepShells();

  for (var i = P.length - 1; i >= 0; i--) {
    var p = P[i];
    p.px = p.x; p.py = p.y;

    p.vy += p.g;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 1;

    if (p.life <= 0) {
      // 子母弹
      if (p.sub > 0 && rnd() < p.sub && P.length < MAXP * 0.9) {
        var c = 8;
        for (var k = 0; k < c; k++) {
          var a = rnd() * 6.2832, sp = H * 0.0016 * rr(0.6, 1.3);
          addP(p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp, {
            g: GRAV * S, drag: 0.93, life: 26, size: 1.5 * S,
            color: hsl(p.hue + rr(-30, 30), 82, 1), hue: p.hue, tws: 0.14
          });
        }
      }
      P[i] = P[P.length - 1]; P.pop(); release(p);
      continue;
    }
    if (p.y > H + 60 || p.x < -80 || p.x > W + 80) {
      P[i] = P[P.length - 1]; P.pop(); release(p);
    }
  }

  for (var f = flashes.length - 1; f >= 0; f--) {
    flashes[f].life -= 0.075;
    if (flashes[f].life <= 0) flashes.splice(f, 1);
  }

  // 自动放
  if (CFG.auto) {
    autoT--;
    if (autoT <= 0) {
      var salvo = rnd() < 0.16 ? (2 + ((rnd() * 2) | 0)) : 1;
      for (var v = 0; v < salvo; v++) {
        (function (d) { setTimeout(function () { launch(); }, d); })(v * rr(70, 190));
      }
      autoT = rr(34, 86);
    }
  }
}

/* ============================ 绘制 ============================ */
function fadeOut(steps) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.globalAlpha = 1 - Math.pow(1 - 0.15, steps);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

function render(t) {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  // 爆炸瞬间的白光
  for (var f = 0; f < flashes.length; f++) {
    var fl = flashes[f], a = fl.life * fl.life;
    var r = fl.r * (1.5 - fl.life * 0.5);
    var gr = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, r);
    gr.addColorStop(0, 'hsla(' + fl.hue + ',100%,92%,' + (0.85 * a) + ')');
    gr.addColorStop(0.35, 'hsla(' + fl.hue + ',100%,70%,' + (0.35 * a) + ')');
    gr.addColorStop(1, 'hsla(' + fl.hue + ',100%,60%,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(fl.x, fl.y, r, 0, 6.2832);
    ctx.fill();
  }

  for (var i = 0; i < P.length; i++) {
    var p = P[i];
    var k = p.life / p.max;              // 1 → 0
    var al = k > 0.88 ? (1 - k) / 0.12 : k;
    if (p.tws) al *= 1 - p.tws + p.tws * Math.abs(Math.sin(t * 0.035 + p.tw));
    if (al <= 0.01) continue;

    ctx.globalAlpha = al > 1 ? 1 : al;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.size;

    var dx = p.x - p.px, dy = p.y - p.py;
    if (dx * dx + dy * dy < 0.06) {      // 几乎不动 → 画个点
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.5, 0, 6.2832);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ============================ 音效 ============================ */
var ac = null, master = null, comp = null, noiseBuf = null, muted = true;
var SOUND_OK = CFG.sound;

function initAudio() {
  if (ac || !SOUND_OK) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.22;
    master.connect(ac.destination);

    var len = Math.floor(ac.sampleRate * 1.5);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // 限幅：同时炸几朵时峰值会叠到 3 倍，不压就会破音
    // 单朵的峰值刚好在阈值附近，所以只削"齐射"，不糊正常音量
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.knee.value = 12;
    comp.ratio.value = 4;
    comp.attack.value = 0.005;
    comp.release.value = 0.2;
    comp.connect(master);
  } catch (e) { ac = null; }
}
function resumeAudio() {
  if (!ac) return;
  if (ac.state === 'suspended' && ac.resume) ac.resume();
}

/* 从噪声缓冲区的随机位置截一段：几层声音用同一段噪声会同相叠加，
   变成一坨而不是层次，随机错开就有"散"的感觉 */
function noiseSrc(t, off, dur) {
  var s = ac.createBufferSource();
  s.buffer = noiseBuf;
  s.playbackRate.value = rr(0.9, 1.12);
  s.start(t, off, dur);
  return s;
}

function boom(vol, y, kind) {
  if (!ac || !comp || muted) return;

  var t0 = ac.currentTime + 0.005;
  var far = 0.5 + 0.5 * Math.min(1, (y || H * 0.3) / (H * 0.6));   // 越低越近、越响
  vol = Math.min(1, vol * far);
  var off = function () { return rnd() * 0.6; };

  // ① 爆裂「啪」：能量集中在 1.5~3kHz。手机小喇叭唯一还原得清楚的频段，
  //    有它才像烟花；没有就只剩一坨闷响
  var f1 = ac.createBiquadFilter();
  f1.type = 'bandpass'; f1.Q.value = 0.72; f1.frequency.value = rr(1500, 3000);
  var g1 = ac.createGain();
  g1.gain.setValueAtTime(0, t0);
  g1.gain.linearRampToValueAtTime(0.60 * vol, t0 + 0.003);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + rr(0.045, 0.08));
  noiseSrc(t0, off(), 0.12).connect(f1); f1.connect(g1); g1.connect(comp);

  // ② 主体「咚」：能量压在 120~500Hz，手机喇叭放得出来
  var f2 = ac.createBiquadFilter();
  f2.type = 'lowpass'; f2.Q.value = 0.8;
  f2.frequency.setValueAtTime(rr(300, 480), t0);
  f2.frequency.exponentialRampToValueAtTime(150, t0 + 0.45);
  var g2 = ac.createGain();
  g2.gain.setValueAtTime(0, t0);
  g2.gain.linearRampToValueAtTime(0.60 * vol, t0 + 0.010);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + rr(0.34, 0.50));
  noiseSrc(t0, off(), 0.65).connect(f2); f2.connect(g2); g2.connect(comp);

  // ③ 胸腔感：定频短促正弦。关键是不扫频——一扫就成了电子下滑音
  var o = ac.createOscillator(), g3 = ac.createGain();
  o.type = 'sine';
  o.frequency.value = rr(72, 100);   // 别再往下压了，手机喇叭 60Hz 以下基本是失真
  g3.gain.setValueAtTime(0, t0);
  g3.gain.linearRampToValueAtTime(0.16 * vol, t0 + 0.008);
  g3.gain.exponentialRampToValueAtTime(0.001, t0 + rr(0.18, 0.28));
  o.connect(g3); g3.connect(comp);
  o.start(t0); o.stop(t0 + 0.35);

  // ④ 楼群回声：延迟一点点的闷噪声，声音立刻有了空间
  var te = t0 + rr(0.10, 0.16);
  var f4 = ac.createBiquadFilter(); f4.type = 'lowpass'; f4.frequency.value = 260;
  var g4 = ac.createGain();
  g4.gain.setValueAtTime(0, te);
  g4.gain.linearRampToValueAtTime(0.14 * vol, te + 0.03);
  g4.gain.exponentialRampToValueAtTime(0.001, te + 0.45);
  noiseSrc(t0, off(), 0.75).connect(f4); f4.connect(g4); g4.connect(comp);

  // ⑤ 闪光菊专属：噼里啪啦的尾音
  if (kind === 'crackle') {
    for (var i = 0; i < 14; i++) {
      var tk = t0 + rr(0.06, 0.62);
      var f5 = ac.createBiquadFilter();
      f5.type = 'bandpass';
      f5.frequency.value = rr(2600, 6500); f5.Q.value = 1.4;
      var g5 = ac.createGain();
      g5.gain.setValueAtTime(0, tk);
      g5.gain.linearRampToValueAtTime(0.13 * vol * rnd(), tk + 0.002);
      g5.gain.exponentialRampToValueAtTime(0.001, tk + 0.02);
      noiseSrc(tk, off(), 0.05).connect(f5); f5.connect(g5); g5.connect(comp);
    }
  }
}

/* ============================ 主循环 ============================ */
var STEP = 1000 / 60, acc = 0, last = 0, rafId = 0, clock = 0;

function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (!last) { last = now; return; }
  var dt = now - last;
  last = now;
  if (dt > 120) dt = 120;

  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 4) { update(); acc -= STEP; steps++; }
  if (steps === 4) acc = 0;
  if (!steps) return;

  clock += dt;
  fadeOut(steps);
  render(clock);
  drawStars(clock);
}

function start() {
  if (rafId) return;
  last = 0; acc = 0;
  rafId = requestAnimationFrame(frame);
}
function stop() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}

/* ============================ 交互 ============================ */
var lastTap = 0;
function onTap(x, y) {
  var now = Date.now();
  if (now - lastTap < 90) return;      // 防抖
  lastTap = now;

  initAudio();
  resumeAudio();

  // 点哪儿立刻在哪儿开一朵
  burst(x, y, { speed: H * 0.0042, scale: 0.8 });
  // 再从地面补一发飞上去
  launch(x, y);
}

function bindTap() {
  var hasPointer = !!window.PointerEvent;
  function pos(e) {
    var t = e.touches && e.touches[0] ? e.touches[0] : e;
    return [t.clientX, t.clientY];
  }
  function handler(e) {
    if (e.touches && e.touches.length > 1) return;   // 多指忽略（缩放手势）
    var p = pos(e);
    onTap(p[0], p[1]);
  }
  if (hasPointer) {
    document.addEventListener('pointerdown', handler, { passive: true });
  } else {
    document.addEventListener('touchstart', handler, { passive: true });
    document.addEventListener('mousedown', handler, false);
  }
  // 禁掉滚动 / 下拉刷新 / 长按菜单
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
}

/* ---------- 声音按钮 ---------- */
function setupSoundBtn() {
  var btn = document.getElementById('snd');
  var saved = null;
  try { saved = localStorage.getItem('fw_muted'); } catch (e) {}
  muted = saved === null ? false : saved === '1';
  btn.className = muted ? 'muted' : '';

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    btn.className = muted ? 'muted' : '';
    try { localStorage.setItem('fw_muted', muted ? '1' : '0'); } catch (e2) {}
    if (!muted) { initAudio(); resumeAudio(); boom(0.7, H * 0.4); }
  });
  btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); }, false);
  btn.addEventListener('touchstart', function (e) { e.stopPropagation(); }, { passive: true });
}

/* ---------- 文案 ---------- */
function setupText() {
  var box = document.getElementById('txt');
  var h = box.querySelector('h1'), p = box.querySelector('p');
  if (CFG.title)    h.textContent = CFG.title; else h.style.display = 'none';
  if (CFG.subtitle) p.textContent = CFG.subtitle; else p.style.display = 'none';
  if (!CFG.title && !CFG.subtitle) box.style.display = 'none';
  document.title = CFG.title || '烟花';
}

/* ============================ 启动 ============================ */
resize();
GRAV = H * 0.000036;
setupText();
setupSoundBtn();
bindTap();

window.addEventListener('resize', (function () {
  var tm = 0;
  return function () {
    clearTimeout(tm);
    tm = setTimeout(function () {
      GRAV = window.innerHeight * 0.000036;
      resize();
    }, 160);
  };
})(), false);
window.addEventListener('orientationchange', function () {
  setTimeout(function () { GRAV = window.innerHeight * 0.000036; resize(); }, 320);
}, false);

document.addEventListener('visibilitychange', function () {
  if (document.hidden) stop(); else start();
}, false);
window.addEventListener('pageshow', function () { start(); }, false);

start();
// 开场先来三发
setTimeout(function () { launch(W * 0.5, H * 0.24); }, 260);
setTimeout(function () { launch(W * 0.24, H * 0.34); }, 620);
setTimeout(function () { launch(W * 0.78, H * 0.20); }, 1080);

})();
</script>
</body>
